<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Map & Booking Widget</title>
  <link rel="stylesheet" href="https://smartbeachcleanups.com/beach-style.css" />
  <style>
    body { margin: 0; padding: 16px; background: #f4f6f7; }

    /* Heatmap grid: sector label column + 21 sub-columns (7 days × 3 slots) */
    .heatmap-grid {
      grid-template-columns: 100px repeat(21, 1fr) !important;
      grid-auto-rows: auto;
      width: 100%;
      box-sizing: border-box;
    }

    .heatmap-section {
      justify-content: stretch !important;
    }

    .heatmap-container {
      width: 100%;
      box-sizing: border-box;
      padding: 20px !important;
      overflow-x: auto;
    }

    /* Day header spans 3 sub-columns */
    .day-header {
      grid-column: span 3;
      text-align: center;
      font-size: 0.75rem;
      padding: 4px 2px;
      border-bottom: 1px solid #ddd;
    }
    .day-header.today {
      font-weight: 700;
      border: 2px solid #0b3d2e;
      border-radius: 4px;
    }

    /* Time slot sub-header */
    .slot-header {
      text-align: center;
      font-size: 0.6rem;
      color: #666;
      padding: 6px 1px;
      border-bottom: 1px solid #eee;
      height: 44px;
      box-sizing: border-box;
      white-space: nowrap;
      line-height: 1.3;
    }

    /* Left border to visually separate each day */
    .day-start {
      border-left: 2px solid #ccc;
    }

    /* Clickable cells */
    .cell {
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .cell:hover { opacity: 0.75; }
    .cell.full { cursor: not-allowed; }
    .cell.full:hover { opacity: 1; }

    .heatmap-legend {
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
      margin: 0 0 12px 0; padding: 10px 14px;
      background: rgba(255,255,255,0.7); border: 1px solid #ddd;
      border-radius: 8px; font-size: 0.85rem;
    }
    .legend-title  { font-weight: 600; color: #0b3d2e; margin-right: 4px; }
    .legend-item   { display: flex; align-items: center; gap: 6px; }
    .legend-swatch { display: inline-block; width: 18px; height: 18px;
                     border-radius: 4px; border: 1px solid rgba(0,0,0,0.12); flex-shrink: 0; }
    .legend-label  { color: #333; }
  </style>
</head>
<body>

  <h1>Beach Cleanup – Sector Reservation</h1>

  <!-- MAP + BOOKING PANEL -->
  <div class="container">
    <div id="map"></div>
    <div class="panel">
      <h2>Reserve a Cleanup Time</h2>
      <label>Selected Section</label>
      <input id="selectedSector" disabled />
      <label>Your Name</label>
      <input id="name" placeholder="Jane Doe" />
      <label>Your Email</label>
      <input id="email" type="email" placeholder="you@email.com" />
      <label for="cleanupDate">Cleanup Date</label>
      <input type="date" id="cleanupDate" />
      <label>Time Slot</label>
      <select id="timeSlot">
        <option value="">Select a time</option>
        <option>8:30 – 9:30</option>
        <option>9:30 – 10:30</option>
        <option>10:30 – 11:30</option>
      </select>
      <button id="reserveBtn">Reserve Slot</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <!-- HEATMAP -->
  <section class="heatmap-section">
    <div class="heatmap-container">

      <div class="heatmap-header">
        <button class="week-nav" id="prevWeek">←</button>
        <select class="week-select" id="weekSelect"></select>
        <button class="week-nav" id="nextWeek">→</button>
      </div>

      <div class="heatmap-legend">
        <span class="legend-title">Volunteers per slot:</span>
        <div class="legend-item"><span class="legend-swatch" style="background:#1b5e20;"></span><span class="legend-label">0</span></div>
        <div class="legend-item"><span class="legend-swatch" style="background:#00e676;"></span><span class="legend-label">1–3</span></div>
        <div class="legend-item"><span class="legend-swatch" style="background:#b9f6ca;"></span><span class="legend-label">4–6</span></div>
        <div class="legend-item"><span class="legend-swatch" style="background:#90caf9;"></span><span class="legend-label">7–9</span></div>
        <div class="legend-item"><span class="legend-swatch" style="background:#ffffff;border:1px solid #ccc;"></span><span class="legend-label">Full (10/10)</span></div>
      </div>

      <div class="heatmap-grid" id="heatmapGrid"></div>
    </div>
  </section>

  <script src="https://smartbeachcleanups.com/config.js"></script>
  <script src="https://smartbeachcleanups.com/auth.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAcYSXztDpMOQ5mRPFKNYiptHsS6jSPJRs&callback=initMap" async defer></script>

  <script>
    const CLIENT_ID = new URLSearchParams(window.location.search).get("client") || "demo";
    const API_BASE  = "https://api.smartbeachcleanups.com";
    const TIME_SLOTS = ["8:30 – 9:30", "9:30 – 10:30", "10:30 – 11:30"];

    // ── Map ───────────────────────────────────────────────────────────────────
    let map, selectedSector = null;
    const polygons = {};

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 15, center: { lat: 26.8919, lng: -80.0556 }, mapTypeId: "satellite",
      });
      drawSectors();
    }

    function drawSectors() {
      for (const sector in SECTORS) {
        const polygon = new google.maps.Polygon({
          paths: SECTORS[sector],
          strokeColor: "#f7180c", strokeOpacity: 1, strokeWeight: 2,
          fillColor: "#00ff88",   fillOpacity: 0.35,
        });
        polygon.setMap(map);
        polygon.addListener("click", () => selectSector(sector));
        polygons[sector] = polygon;

        const bounds = new google.maps.LatLngBounds();
        SECTORS[sector].forEach(c => bounds.extend(c));
        new google.maps.Marker({
          position: bounds.getCenter(), map,
          label: { text: sector, color: "#000000", fontWeight: "700", fontSize: "18px" },
          icon:  { path: google.maps.SymbolPath.CIRCLE, scale: 0 },
        });
      }
    }

    function selectSector(sector) {
      for (const s in polygons) {
        polygons[s].setOptions({ fillColor: "#00ff88", fillOpacity: 0.35,
          strokeColor: "#ffffff", strokeOpacity: 1, strokeWeight: 2 });
      }
      polygons[sector].setOptions({ fillColor: "#ffcc00", fillOpacity: 0.45,
        strokeColor: "#1f6fe5", strokeOpacity: 1, strokeWeight: 3 });
      selectedSector = sector;
      document.getElementById("selectedSector").value = sector;
    }

    // ── Pre-fill booking form from heatmap click ──────────────────────────────
    function prefillBooking(sectorKey, dateStr, timeSlot) {
      // Highlight the sector on the map
      selectSector(sectorKey);

      // Fill date and time slot
      document.getElementById("cleanupDate").value = dateStr;
      const slotSelect = document.getElementById("timeSlot");
      for (const opt of slotSelect.options) {
        if (opt.value === timeSlot || opt.textContent === timeSlot) {
          opt.selected = true;
          break;
        }
      }

      // Scroll to the booking panel
      document.querySelector(".panel").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // ── Reserve button ────────────────────────────────────────────────────────
    document.addEventListener("DOMContentLoaded", async () => {
      // Prevent selecting past dates
      const todayStr = new Date().toISOString().split("T")[0];
      document.getElementById("cleanupDate").min = todayStr;

      await initAuthWidget();
      document.getElementById("reserveBtn").addEventListener("click", async () => {
        const name     = document.getElementById("name").value.trim();
        const email    = document.getElementById("email").value.trim();
        const timeSlot = document.getElementById("timeSlot").value;
        const date     = document.getElementById("cleanupDate").value;
        const statusEl = document.getElementById("status");

        if (!selectedSector) { alert("Please click a sector on the map."); return; }
        if (!name)           { alert("Please enter your name.");            return; }
        if (!email)          { alert("Please enter your email.");           return; }
        if (!timeSlot)       { alert("Please choose a time slot.");         return; }
        if (!date)           { alert("Please choose a cleanup date.");      return; }

        const btn = document.getElementById("reserveBtn");
        btn.disabled = true; btn.textContent = "Reserving…"; statusEl.innerText = "";

        try {
          const res  = await apiFetch(`${API_BASE}/bookings?client=${CLIENT_ID}`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sector: selectedSector, timeslot: timeSlot, name, email, date }),
          });
          const data = await res.json();
          if (data.success) {
            statusEl.style.color = "#27ae60";
            statusEl.innerText = `Booking confirmed: ${data.message}`;
            for (const s in polygons) {
              polygons[s].setOptions({ fillColor: "#00ff88", fillOpacity: 0.35,
                strokeColor: "#ffffff", strokeOpacity: 1, strokeWeight: 2 });
            }
            selectedSector = null;
            ["selectedSector","name","email","timeSlot"].forEach(id => {
              document.getElementById(id).value = "";
            });
            loadHeatmapFromApi();
          } else {
            statusEl.style.color = "#c0392b";
            statusEl.innerText = `Booking not completed: ${data.message}`;
          }
        } catch {
          statusEl.style.color = "#c0392b";
          statusEl.innerText = "We couldn't complete your booking right now. Please try again in a moment.";
        } finally {
          btn.disabled = false; btn.textContent = "Reserve Slot";
        }
      });
    });

    // ── Heatmap ───────────────────────────────────────────────────────────────
    const grid  = document.getElementById("heatmapGrid");
    const today = new Date(); today.setHours(0,0,0,0);

    function getWeekStart(date) {
      const d = new Date(date);
      d.setHours(0,0,0,0);
      return d;
    }

    let weekStart = getWeekStart(today);
    let heatmapApiData = null;

    function countToColor(n) {
      if (n === 0)  return "#1b5e20";
      if (n <= 3)   return "#00e676";
      if (n <= 6)   return "#b9f6ca";
      if (n < 10)   return "#90caf9";  // light blue = 7–9, still has spots
      return "#ffffff";                 // white = full (10/10)
    }

    function fmtDate(d) {
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    function shortSlot(slot) {
      return slot.split("–")[0].trim(); // "8:30 – 9:30" → "8:30"
    }

    // ── Week selector ─────────────────────────────────────────────────────────
    function buildWeekOptions() {
      const select    = document.getElementById("weekSelect");
      const targetKey = weekStart.toISOString().split("T")[0];
      select.innerHTML = "";

      for (let w = -8; w <= 4; w++) {
        const ws = getWeekStart(today);
        ws.setDate(ws.getDate() + w * 7);
        const we = new Date(ws); we.setDate(we.getDate() + 6);
        const key = ws.toISOString().split("T")[0];

        const opt = document.createElement("option");
        opt.value       = key;
        opt.textContent = `${fmtDate(ws)} – ${fmtDate(we)}`;
        if (key === targetKey) opt.selected = true;
        select.appendChild(opt);
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function renderHeatmap() {
      const columnDates = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(weekStart);
        d.setDate(weekStart.getDate() + i);
        return d;
      });

      grid.innerHTML = "";

      // ── Row 1: corner + day headers (each spans 3 columns) ────────────────
      grid.appendChild(document.createElement("div")); // corner

      columnDates.forEach(d => {
        const header  = document.createElement("div");
        const isToday = d.toDateString() === today.toDateString();
        header.className = "day-header day-start" + (isToday ? " today" : "");
        header.innerHTML =
          d.toLocaleDateString("en-US", { weekday: "short" }) + "<br>" +
          d.toLocaleDateString("en-US", { month: "numeric", day: "numeric" });
        grid.appendChild(header);
      });

      // ── Row 2: empty corner + slot sub-headers (one per slot per day) ─────
      grid.appendChild(document.createElement("div")); // corner

      columnDates.forEach(() => {
        TIME_SLOTS.forEach((slot, i) => {
          const sh = document.createElement("div");
          sh.className   = "slot-header" + (i === 0 ? " day-start" : "");
          sh.textContent = shortSlot(slot);
          grid.appendChild(sh);
        });
      });

      // ── Sector rows ───────────────────────────────────────────────────────
      ["Sector A","Sector B","Sector C","Sector D"].forEach(sectorLabel => {
        const key = sectorLabel.replace("Sector ", "");

        const lbl = document.createElement("div");
        lbl.className   = "sector-label";
        lbl.textContent = sectorLabel;
        grid.appendChild(lbl);

        columnDates.forEach(d => {
          const dateStr = d.toISOString().split("T")[0];

          TIME_SLOTS.forEach((slot, i) => {
            const count = heatmapApiData
              ? (heatmapApiData.counts?.[key]?.[slot]?.[dateStr] ?? 0)
              : null;
            const isPast = d < today;
            const full   = count !== null && count >= 10;
            let color;

            if (count !== null) {
              color = countToColor(count);
            } else {
              color = "#e0e0e0"; // grey placeholder while API loads
            }

            const cell = document.createElement("div");
            const blocked = full || isPast;
            cell.className        = "cell" + (i === 0 ? " day-start" : "") + (blocked ? " full" : "");
            cell.style.background = color;
            if (isPast) cell.style.opacity = "0.4";
            if (!blocked) {
              cell.addEventListener("click", () => prefillBooking(key, dateStr, slot));
            }
            grid.appendChild(cell);
          });
        });
      });
    }

    // ── Week nav controls ─────────────────────────────────────────────────────
    document.getElementById("prevWeek").onclick = () => {
      weekStart.setDate(weekStart.getDate() - 7);
      buildWeekOptions();
      renderHeatmap();
    };

    document.getElementById("nextWeek").onclick = () => {
      weekStart.setDate(weekStart.getDate() + 7);
      buildWeekOptions();
      renderHeatmap();
    };

    document.getElementById("weekSelect").onchange = () => {
      const val = document.getElementById("weekSelect").value;
      weekStart = new Date(val + "T00:00:00");
      renderHeatmap();
    };

    // Initial render with fallback colors; replaced by real data once API responds
    buildWeekOptions();
    renderHeatmap();

    // ── Fetch real heatmap data ───────────────────────────────────────────────
    async function loadHeatmapFromApi() {
      try {
        const r = await apiFetch(`${API_BASE}/heatmap?client=${CLIENT_ID}`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        heatmapApiData = await r.json();
        renderHeatmap();
        console.log(`[heatmap] Loaded from API (client=${CLIENT_ID})`);
      } catch (err) {
        console.warn("[heatmap] API unreachable — using fallback colors.", err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", loadHeatmapFromApi);
  </script>

</body>
</html>
