<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Beach Cleanup – Upload Photos</title>
  <link rel="stylesheet" href="https://smartbeachcleanups.com/beach-style.css" />
  <style>
    body { display: flex; flex-direction: column; align-items: center; margin: 0; padding: 16px; background: #f4f6f7; }
    .container { display: flex; justify-content: center; width: 100%; }
    .panel { max-width: 900px; width: 100%; }
    .upload-box { border: 2px dashed #aaa; padding: 40px; text-align: center; cursor: pointer; margin: 0 auto; }
    .upload-box input { display: none; }
    .results { margin-top: 24px; }
  </style>
</head>
<body>

  <h1>Upload Cleanup Photos</h1>

  <div class="container">
    <div class="panel">
      <label class="upload-box">
        <h2>Upload Photos</h2>
        <p>Drag & drop photos here or click to browse</p>
        <p style="opacity:0.7; font-size:0.9rem;">JPG, PNG</p>
        <input type="file" id="photoInput" multiple accept="image/*">
      </label>
      <div class="results" id="results"></div>
    </div>
  </div>

  <script src="https://smartbeachcleanups.com/auth.js"></script>
  <script>
    const CLIENT_ID = new URLSearchParams(window.location.search).get("client") || "demo";
    const API_BASE  = "https://api.smartbeachcleanups.com";

    document.addEventListener("DOMContentLoaded", initAuthWidget);

    const input     = document.getElementById("photoInput");
    const resultsEl = document.getElementById("results");
    const uploadBox = document.querySelector(".upload-box");

    const MAX_PHOTOS = 10;
    const MAX_SIDE   = 2000;   // shrink in the browser first; the server does the final resize

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = e => resolve(e.target.result);
        reader.onerror = () => reject(new Error(`Could not read ${file.name}`));
        reader.readAsDataURL(file);
      });
    }

    // Phone photos can be 5-10 MB each; shrinking first keeps uploads fast and under the size limit.
    // Falls back to the original file if the browser can't decode it.
    async function shrinkToDataURL(file) {
      try {
        const bmp   = await createImageBitmap(file);   // applies the photo's rotation
        const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
        const canvas = document.createElement("canvas");
        canvas.width  = Math.round(bmp.width * scale);
        canvas.height = Math.round(bmp.height * scale);
        canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
        bmp.close();
        return canvas.toDataURL("image/jpeg", 0.9);
      } catch {
        return readFileAsDataURL(file);
      }
    }

    // All text from the server or file names is inserted with textContent, never innerHTML.
    function el(tag, text, css) {
      const node = document.createElement(tag);
      if (text) node.textContent = text;
      if (css)  node.style.cssText = css;
      return node;
    }

    function showMessage(text, isError) {
      resultsEl.replaceChildren(el("p", text,
        `text-align:center;padding:20px;${isError ? "color:#c0392b;" : "opacity:0.6;"}`));
    }

    input.addEventListener("change", async () => {
      const files = [...input.files];
      input.value = "";
      if (files.length === 0) return;
      if (files.length > MAX_PHOTOS) {
        showMessage(`Please choose at most ${MAX_PHOTOS} photos at a time.`, true);
        return;
      }

      uploadBox.style.opacity = "0.5";
      uploadBox.style.cursor  = "default";
      resultsEl.replaceChildren(
        el("p", `Uploading ${files.length} photo(s)…`, "text-align:center;padding:20px 20px 0;opacity:0.6;"),
        el("p", "Checking photos. This may take a few seconds.", "text-align:center;font-size:0.85rem;opacity:0.6;"));

      try {
        const photoPayloads = await Promise.all(
          files.map(async file => ({ name: file.name, src: await shrinkToDataURL(file) }))
        );
        const response = await apiFetch(`${API_BASE}/photos?client=${encodeURIComponent(CLIENT_ID)}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uploader_name: "Volunteer", photos: photoPayloads }),
        });
        if (response.status === 413) { showMessage("These photos are too large together. Try uploading fewer at a time.", true); return; }
        if (response.status === 429) { showMessage("Too many uploads right now. Please wait a minute and try again.", true); return; }
        if (response.status === 401) { showMessage("Your session has expired. Please reload the page and log in again.", true); return; }
        renderResults(await response.json());
      } catch (err) {
        showMessage("Couldn't upload right now. Please check your connection and try again.", true);
      } finally {
        uploadBox.style.opacity = "1";
        uploadBox.style.cursor  = "pointer";
      }
    });

    function renderResults(data) {
      resultsEl.replaceChildren();
      if (data.accepted?.length > 0) {
        resultsEl.appendChild(el("p", `${data.accepted.length} photo(s) added to the gallery`,
          "color:#27ae60;font-weight:600;margin-bottom:8px;"));
        const ul = el("ul", "", "margin:0 0 16px 0;padding-left:20px;");
        data.accepted.forEach(p => ul.appendChild(el("li", p.name)));
        resultsEl.appendChild(ul);
        const link = el("a", "View photos in the Gallery");
        link.href   = `https://smartbeachcleanups.com/gallery.html?client=${encodeURIComponent(CLIENT_ID)}`;
        link.target = "_parent";
        const p = el("p"); p.appendChild(link); resultsEl.appendChild(p);
      }
      if (data.rejected?.length > 0) {
        resultsEl.appendChild(el("p", `${data.rejected.length} photo(s) not added`,
          "color:#c0392b;font-weight:600;margin:16px 0 8px;"));
        const ul = el("ul", "", "margin:0;padding-left:20px;");
        data.rejected.forEach(p => {
          const li = el("li");
          li.appendChild(el("strong", p.name));
          li.appendChild(document.createTextNode(` — ${p.reason}`));
          ul.appendChild(li);
        });
        resultsEl.appendChild(ul);
      }
      if (!data.accepted?.length && !data.rejected?.length) {
        showMessage(data.message || "Something went wrong. Please try again.", false);
      }
    }
  </script>

</body>
</html>
